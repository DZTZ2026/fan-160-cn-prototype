<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>包网 需求与原型 :: 包网需求清单</title>
  <link rel="stylesheet" href="catalog.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="top-brand">包网 需求与原型</div>
      <nav class="top-links" aria-label="视图切换">
        <button type="button" class="top-link is-active" id="navListBtn" data-view="list">需求清单</button>
        <button type="button" class="top-link" id="navAcceptBtn" data-view="acceptance">版本验收</button>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <!-- 视图 1：包网需求清单 -->
    <section class="catalog-card" id="viewList" aria-label="包网需求清单">
      <div class="card-header">
        <div class="card-header-left">
          <h1 class="card-title">包网需求清单</h1>
          <span class="card-counter" id="countSummary">展示 2 / 共 2 条</span>
        </div>
        <div class="card-header-tip">点版本行展开，点具体需求进入原型。</div>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-group">
          <label class="filter-label" for="filterProject">项目</label>
          <select class="filter-select" id="filterProject" aria-label="按项目筛选">
            <option value="all">全部</option>
            <option value="包网">包网</option>
          </select>
        </div>

        <div class="filter-pills" id="clientPills" role="group" aria-label="按端筛选">
          <button type="button" class="pill-btn is-active" data-client="all">全部</button>
          <button type="button" class="pill-btn" data-client="H5">H5</button>
          <button type="button" class="pill-btn" data-client="Web">Web</button>
          <button type="button" class="pill-btn" data-client="站点后台">站点后台</button>
        </div>

        <div class="filter-date-group">
          <span class="filter-label">提出日期</span>
          <select class="date-select" id="createdYear" aria-label="提出年份">
            <option value="">年</option>
            <option value="2026">2026</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="createdMonth" aria-label="提出月份">
            <option value="">月</option>
            <option value="11">11</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="createdDay" aria-label="提出日期">
            <option value="">日</option>
            <option value="18">18</option>
          </select>
        </div>

        <div class="filter-date-group">
          <span class="filter-label">最近修改日期</span>
          <select class="date-select" id="updatedYear" aria-label="修改年份">
            <option value="">年</option>
            <option value="2026">2026</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="updatedMonth" aria-label="修改月份">
            <option value="">月</option>
            <option value="11">11</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="updatedDay" aria-label="修改日期">
            <option value="">日</option>
            <option value="21">21</option>
          </select>
        </div>

        <div class="filter-date-group">
          <span class="filter-label">截止</span>
          <select class="date-select" id="dueYear" aria-label="截止年份">
            <option value="">年</option>
            <option value="2026">2026</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="dueMonth" aria-label="截止月份">
            <option value="">月</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="dueDay" aria-label="截止日期">
            <option value="">日</option>
            <option value="30">30</option>
          </select>
        </div>

        <div class="filter-search-group">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="搜索需求"
            aria-label="搜索需求名称或版本号"
          />
          <button type="button" class="reset-btn" id="resetFilterBtn">重置</button>
        </div>
      </div>

      <!-- 需求清单表格 -->
      <div class="table-wrap">
        <table class="req-table">
          <thead>
            <tr>
              <th class="col-ver">需求版本号</th>
              <th class="col-name">需求名称</th>
              <th class="col-proj">项目</th>
              <th class="col-client">端</th>
              <th class="col-date">提出日期</th>
              <th class="col-date">最近修改日期</th>
              <th class="col-due">截止</th>
            </tr>
          </thead>
          <tbody id="reqTableBody">
            <!-- 由 catalog.js 渲染 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 视图 2：版本验收（对应 PRD R01-R07 验收项） -->
    <section class="catalog-card" id="viewAcceptance" hidden aria-label="版本验收清单">
      <div class="card-header">
        <div class="card-header-left">
          <h1 class="card-title">V1.0.0 版本验收清单</h1>
          <span class="card-counter" id="acceptProgressText">已完成 0 / 7 项</span>
        </div>
        <div class="accept-header-actions">
          <a href="h5.html" class="quick-proto-link">打开 H5 原型 ↗</a>
          <a href="admin.html" class="quick-proto-link quick-proto-link--dark">打开站点后台原型 ↗</a>
        </div>
      </div>

      <div class="accept-list" id="acceptList">
        <!-- 由 catalog.js 渲染 -->
      </div>
    </section>
  </main>

  <script src="catalog.js"></script>
</body>
</html>
